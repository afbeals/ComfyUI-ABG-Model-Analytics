name: Tests
on: [push, pull_request]
jobs:
  backend:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt ruff
      - run: python -m unittest discover -s tests -v
      - run: ruff check .
      - run: ruff format --check .
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt playwright
      - run: playwright install --with-deps chromium
      - run: python scripts/build_preview.py
      - run: python -m tests.browser_smoke
      - run: python -m tests.preview_smoke
